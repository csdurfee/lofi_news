name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync
      
      - name: Install chromium
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run python manage.py test
