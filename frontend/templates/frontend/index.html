<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Lofi News</title>
</head>
<body class="font-mono dark dark:bg-black dark:text-white">
    <header class="flex justify-between items-center">
        <div class="inline-flex items-center p-5 text-3xl">Lofi <span class="pl-2 font-bold">News</span></div>
        <div>
            <a class="inline-flex" href="/about">About</a>
            {% if user.is_authenticated %}
            <span class="inline-flex pl-5 text-gray-400">{{ user.username }}</span>
            <form class="inline" method="post" action="/accounts/logout/">
                {% csrf_token %}
                <button type="submit" class="inline-flex pl-5 hover:text-amber-300 transition-colors">Log out</button>
            </form>
            {% else %}
            <a class="inline-flex pl-5" href="/accounts/login/">Log in</a>
            <a class="inline-flex pl-5 text-amber-300" href="/join">Join (it's free)</a>
            {% endif %}
        </div>
    </header>
    {% include "frontend/stories.html" %}

    <div id="load-more" data-signals:last-id="{{ last_id }}"
        data-on-intersect="@get('/more')">Loading...</div>
</body>
</html>
