<!DOCTYPE html>
<html lang="en">
{% include "frontend/head.html" %}
<body class="font-mono dark dark:bg-black dark:text-white min-h-screen">
    {% include "frontend/body_top_bar.html" with page="login" %}

    <main class="flex justify-center mt-20 px-4">
        <div class="w-full max-w-sm">
            <h1 class="text-2xl font-bold mb-8">Log in</h1>

            {% if form.errors %}
            <p class="text-red-400 mb-4">Invalid username or password.</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-4">
                    <label class="block text-sm mb-1 text-gray-400" for="id_username">Username</label>
                    <input id="id_username" name="username" type="text" autofocus autocomplete="username"
                        class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 focus:outline-none focus:border-amber-300">
                </div>

                <div class="mb-6">
                    <label class="block text-sm mb-1 text-gray-400" for="id_password">Password</label>
                    <input id="id_password" name="password" type="password" autocomplete="current-password"
                        class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 focus:outline-none focus:border-amber-300">
                </div>

                <button type="submit"
                    class="w-full bg-amber-300 text-black font-bold py-2 rounded hover:bg-amber-200 transition-colors">
                    Log in
                </button>
            </form>
        </div>
    </main>
</body>
</html>
